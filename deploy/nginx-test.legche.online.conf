# ─────────────────────────────────────────────────────────────────────────
# nginx для тестовой среды — test.legche.online
#
# Куда положить на сервере:
#   /etc/nginx/sites-available/test.legche.online
# Затем включить:
#   ln -s /etc/nginx/sites-available/test.legche.online /etc/nginx/sites-enabled/
#
# Отличие от боевой схемы: тест живёт на ОДНОМ поддомене —
# и приложение, и API. Всё, что начинается с /api/v1/, уходит
# в тестовый API (порт 8789), остальное — в тестовый фронтенд (8081).
# Так нужен всего один сертификат и нет проблем с CORS.
#
# Этот файл — ТОЛЬКО HTTP (порт 80). HTTPS-часть допишет certbot
# автоматически при выпуске сертификата.
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name test.legche.online;

    # Ограничение размера запроса (как на проде)
    client_max_body_size 2m;

    # API тестовой среды
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Фронтенд тестовой среды
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
