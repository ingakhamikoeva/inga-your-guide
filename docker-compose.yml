# ─────────────────────────────────────────────────────────────────────────
# Self-hosted Legche / Инга stack — 3 services.
#
#   db   — Postgres 15 (app schema + auth tables)
#   api  — Our Node API (JWT + DeepSeek + business endpoints) on :8787
#   web  — Vite SPA (nginx static)
#
# No Kong, GoTrue, PostgREST, Realtime, Storage or Studio. The frontend
# talks ONLY to our Node API at /api/v1/*.
# ─────────────────────────────────────────────────────────────────────────

services:
  # ── Database ──────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: legche-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - legche_pgdata:/var/lib/postgresql/data
      # App schema. Runs once on an empty volume.
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Our Node API ──────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: legche-api:latest
    container_name: legche-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8787"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SITE_URL: ${SITE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      SMTP_INGA_USER: ${SMTP_INGA_USER}
      SMTP_INGA_PASS: ${SMTP_INGA_PASS}
      SMTP_SUPPORT_USER: ${SMTP_SUPPORT_USER}
      SMTP_SUPPORT_PASS: ${SMTP_SUPPORT_PASS}
      EMAIL_DRIP_ENABLED: ${EMAIL_DRIP_ENABLED}
      # AI provider
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # SMTP for password reset / email confirm
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Inga}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@legche.online}
      # OAuth (Phase 6)
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_APPLE_CLIENT_ID: ${OAUTH_APPLE_CLIENT_ID}
      OAUTH_APPLE_CLIENT_SECRET: ${OAUTH_APPLE_CLIENT_SECRET}
    ports:
      - "127.0.0.1:8787:8787"

  # ── Frontend SPA ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: legche-web:latest
    container_name: legche-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:80"

# ─────────────────────────────────────────────────────────────────────────
# Persistent named volumes.
#
# Survive: restart / stop / down / up --build / pull / image upgrade.
# Destroyed ONLY by: `docker compose down -v` or `docker volume rm legche_pgdata`.
# ─────────────────────────────────────────────────────────────────────────
volumes:
  legche_pgdata:
    name: legche_pgdata
    driver: local
